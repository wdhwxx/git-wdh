[project]
name = "Pythonwdhmm"
version = "0.1.0"
description = "沪深A股日线量化回测与实盘交易系统"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "fpdf2>=2.7.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    "tzdata>=2024.1",
    # V5 内存监控（memory_watcher / health_check）核心依赖：
    # 虽为延迟导入（缺依赖可降级），但内存监控属 V5 核心能力，声明为运行依赖
    "psutil>=6.0.0",
    # 字段加密（field_crypto / metrics_history 用 Fernet）
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# GUI桌面界面依赖
gui = ["PySide6>=6.5.0", "pyqtgraph>=0.13.0"]
# Web看板依赖
web = ["streamlit>=1.25.0", "fastapi>=0.100.0", "uvicorn>=0.23.0"]
# 开发依赖（版本与已验证环境对齐：quant 环境 Python 3.12）
dev = [
    "pytest==9.1.1",
    "black==26.5.1",
    # L4修复: 下限放宽到 0.15（与本地 quant 环境实测版本对齐），CI 仍固定 0.16.3
    "ruff>=0.15.0,<0.17.0",
    "pytest-cov>=5.0.0",
    # 基准测试依赖并入 dev，保证 `pip install -e ".[dev]"` 后
    # 可直接运行完整 pytest（testpaths 含 tests/benchmarks）
    "pytest-benchmark>=4.0.0",
]
# 性能基准测试依赖（与 dev 中的 pytest-benchmark 等价，保留单独分组便于按需安装）
benchmark = ["pytest-benchmark>=4.0.0"]
# Redis 可选缓存后端（myquant/core/cache.py 延迟导入，缺依赖时给出清晰错误）
cache = ["redis>=5.0.0"]
# 实盘交易依赖（为实时行情、券商对接预留）
live = [
    "websocket-client>=1.6.0",       # WebSocket实时行情接入
    "requests>=2.28.0",              # HTTP请求（券商API、行情API）
    "aiohttp>=3.8.0",                # 异步HTTP（高并发行情订阅）
    "schedule>=1.2.0",               # 定时任务（盘前更新、盘中巡检、盘后报告）
    "pika>=1.3.0",                   # RabbitMQ 事件总线传输（myquant/core/transports/rabbitmq_bus.py）
    # 券商SDK（按需安装，不强制）
    # "xtp-python>=2.2.0",           # 中泰XTP极速交易API
    # "qmt>=1.0.0",                   # 迅投QMT交易API
    # "tqsdk>=3.0.0",                 # 天勤量化（期货）
]

# ===== 插件入口点（为外部策略包、券商适配器预留）=====
[project.entry-points."myquant.strategies"]
# 策略插件入口：外部包可通过此入口注册自定义策略
# 示例：external_ma = "external_pkg.strategies:ExternalMaStrategy"

[project.entry-points."myquant.brokers"]
# 券商适配器插件入口：外部包可通过此入口注册自定义券商对接
# 示例：xtp_broker = "xtp_adapter.brokers:XtpBroker"
# 示例：qmt_broker = "qmt_adapter.brokers:QmtBroker"

[project.entry-points."myquant.data_sources"]
# 数据源插件入口：外部包可通过此入口注册自定义行情数据源
# 示例：tushare_source = "tushare_adapter.sources:TushareSource"

# ===== 构建系统配置 =====
[tool.setuptools.packages.find]
where = ["."]
include = ["myquant*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ===== ruff 规则契约（P3-4 新增，固定可复现）=====
[tool.ruff]
target-version = "py310"
line-length = 88
# L4修复: backups/ 为审计修复备份目录（不入库、不参与 lint），排除防 CI 基线污染
exclude = ["backups"]

[tool.ruff.lint]
# 项目沿用 ruff 经典默认规则集（E4/E7/E9/F）+ isort（I）。
# 说明：ruff 0.16 的默认规则集显著扩大（新增 UP/DTZ/BLE/PIE 等现代规则），
# 若不显式固定规则集，历史代码会出现 5000+ 项"新规则"告警。
# 此处固定规则集 + dev 依赖固定 ruff 0.16.x，保证构建与 lint 可复现。
# 历史 lint 债（F401/F541/I001 等约 530 项）及 UP 等现代规则差异，
# 列入 docs/回测性能优化实施报告_v5.md 遗留债清单（P3-5）。
select = ["E4", "E7", "E9", "F", "I"]

# ===== pytest配置（防未来函数测试专用标记）=====
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/leakage_gate", "tests/benchmarks", "tests/scripts"]
markers = [
    "lookahead: 防未来函数校验测试（强制通过）",
    "slow: 慢速测试（全量回测，默认跳过）",
    "benchmark: 性能基准测试（默认跳过）",
]

# 文件名：.github/workflows/ci.yml
# Pythonwdhmm 鲲鹏量化交易系统 — CI 流水线（V5 版）
# ============================================================
# 每次推送代码或提交 PR 时自动运行：
#   lint             ruff 代码规范（基线护栏：历史债不阻塞，新增违规即失败）
#   test             全量单元测试（tests/unit，Ubuntu + Windows × Python 3.12）
#   consistency-check V5 三模式一致性回归 + 缓存/指纹单元测试 + 引擎基准冒烟
#   backtest-smoke   V5 新模块导入 + 策略注册器验证
#   docker-build     Docker 镜像构建验证（不推送）
#   live-config-check 配置文件完整性 + 防未来函数 + V5 引擎/性能配置验证
#   data-clean       数据清洗专项（清洗单测 + 配置检查）
#   leakage-gate-check 防泄漏门禁台账校验（M0-18：代码真消费配置 + 测试断言配置）
#   static-scan-check   防泄漏静态扫描（M1B-07：全库阻断命中即失败 + 反向测试）
#
# 门禁矩阵（M3-03 扩展，阶段 3 审计收口）：
#   - leakage-gate-check：台账强制项 + 契约/消费侧/sanity/静态（tests/leakage_gate 全量）
#   - static-scan-check ：静态扫描 + 阻断级反向测试（R01a/R02/R04/R05/R09/R10）
#   - leakage-audit-matrix：豁免流（exemption）+ 审计报告（report）+ 清理衔接
#     （cleanup_service）专项全绿 + M3 台账/接线断言
#   - PIT（point-in-time）/横截面 as-of 由 tests/leakage_gate（cross_sectional）纳入
#
# 说明：
#   - Python 版本 3.12（与 conda 环境 quant 一致，pyproject requires-python>=3.10）
#   - 测试套件引用 gui 可选组（test_paper_run_dialog.py 依赖 PySide6），test job 安装 ".[dev,benchmark,gui]"
#     （P2-D12-001 整改；该测试文件内部已设 QT_QPA_PLATFORM=offscreen，无需额外无头配置）
#   - ruff 固定 0.16.3（与 P3-4 基线 530 项测量版本一致）；规则契约见 pyproject [tool.ruff]
#   - 历史 ruff lint 债 530 项（E4/E7/E9/F/I 契约下）列入
#     docs/回测性能优化实施报告_v5.md 遗留债清单，CI 通过基线护栏防新增回退

name: CI

# ===== 触发条件 =====
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # 允许手动触发
  workflow_dispatch:

# ===== 环境变量 =====
env:
  PYTHON_VERSION: "3.12"
  TZ: Asia/Shanghai
  # ruff 历史 lint 债基线（E4/E7/E9/F/I 契约；L4修复: 从 530 更新——
  # 本地 ruff 0.15.1 实测源码（不含 backups）515 项，留 45 余量覆盖 0.16.3 规则差异）
  # v1.2 P0-2: CI (Python 3.12.15 / ruff 0.16.3) 实测 950 项，重基至此值（本机 3.11 实测 922，差 28 全为 I001）
  # 2026-10-15 收紧（#379b 后）：本地全量 ruff 0.16.3 实测 0 违规（131 个违规全部
  # 修复/规范化 noqa，P0-2 基线 929→131→0），基线棘轮收紧到 0：新增任何违规即红
  RUFF_BASELINE: "0"
  # KP-P1-07: BLE001 专项基线（裸 except 异常吞噬数，实测 382；新增即失败，阻断异常吞噬回潮）
  # v1.2 P0-2: CI (Python 3.12.15) 实测 476 项，与本机一致，重基至此值
  BLE001_BASELINE: "476"

jobs:
  # ============================================================
  # 任务1：代码规范检查（ruff + 基线护栏）
  # ============================================================
  lint:
    name: ruff 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装ruff（固定 0.16.3，与基线测量版本一致）
        run: pip install ruff==0.16.3

      - name: ruff检查 + 基线护栏（新增违规即失败，历史债不阻塞）
        env:
          RUFF_BASELINE: ${{ env.RUFF_BASELINE }}
        run: |
          # 生成全量 JSON 报告（历史债存在时 ruff 退出码非 0，用 || true 吸收）
          # L4修复: --exclude backups 双保险（gitignore 未生效时也不污染基线）
          ruff check . --exclude backups --output-format json > ruff_report.json || true
          python -c "
          import json
          import os
          import sys

          data = json.load(open('ruff_report.json', encoding='utf-8'))
          count = len(data)
          baseline = int(os.environ['RUFF_BASELINE'])
          if count > baseline:
              # 打印新增违规的规则分布，便于定位
              from collections import Counter
              dist = Counter(item['code'] for item in data)
              top = ', '.join(f'{c}x{n}' for c, n in dist.most_common(8))
              print(f'❌ ruff 违规 {count} 项 超过基线 {baseline}（存在新增违规！）')
              print(f'   规则分布: {top}')
              sys.exit(1)
          print(f'✅ ruff 违规 {count} 项 ≤ 基线 {baseline}（历史债，不阻塞；见实施报告遗留债清单）')
          "

      - name: ruff BLE001 专项护栏（KP-P1-07：异常吞噬阻断，新增裸 except 即失败）
        env:
          BLE001_BASELINE: ${{ env.BLE001_BASELINE }}
        run: |
          ruff check . --exclude backups --select BLE001 --output-format json > ble001_report.json || true
          python -c "
          import json
          import os
          import sys

          data = json.load(open('ble001_report.json', encoding='utf-8'))
          count = len(data)
          baseline = int(os.environ['BLE001_BASELINE'])
          if count > baseline:
              print(f'❌ BLE001 裸 except 违规 {count} 项 超过基线 {baseline}（存在新增异常吞噬！）')
              sys.exit(1)
          print(f'✅ BLE001 裸 except 违规 {count} 项 ≤ 基线 {baseline}')
          "

  # ============================================================
  # 任务2：全量单元测试（含防未来函数专项）
  # ============================================================
  test:
    name: 单元测试（py${{ matrix.python-version }} / ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    env:
      # Windows runner 默认 cp1252/charmap 控制台，print/subprocess 打中文会崩
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装系统依赖（PySide6 EGL/GL 运行时，headless runner 需要）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: 安装项目（dev + benchmark + gui + web 依赖）
        # P2-D12-001 整改：补 gui extras —— test_paper_run_dialog.py 依赖 PySide6，
        # 缺此组 CI 在收集阶段即失败（该文件 L19 已设 QT_QPA_PLATFORM=offscreen）
        # P0-08 整改：补 web extras —— tests/unit/test_api_middleware.py 顶层 import fastapi
        # （myquant/api/routes.py 依赖），缺 web 组 test job 收集期 ModuleNotFoundError，
        # 并连带 needs:[lint,test] 的 backtest-smoke/docker-build/live-config-check/data-clean 4 job 全阻塞
        run: pip install -e ".[dev,benchmark,gui,web]"

      - name: 安装 CJK 中文字体（ubuntu 腿，PDF 报告中文渲染；#390）
        # #387 CI 暴露：test_candidate_report PDF 真跑后 Undefined font: cjk——
        # 原 _FONT_CANDIDATES 仅 Windows 路径，CI ubuntu 无中文字体。安装
        # fonts-noto-cjk 使 PDF 中文真实可读（跨平台候选 + set_font 兜底双保障）。
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: "关键工具版本断言（L5修复: 依赖未锁定，防版本漂移导致基线失真）"
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import pytest
          from importlib.metadata import version as pkg_version
          ruff_version = pkg_version('ruff')
          assert pytest.__version__ == '9.1.1', f'pytest 版本漂移: {pytest.__version__}'
          print(f'  pytest {pytest.__version__} / ruff {ruff_version} (信息打印，不阻断)')
          "

      - name: 运行门禁核心集（ubuntu 腿：unit+leakage_gate+realism_gate+scripts，产覆盖率；权威口径 §5.4）
        # P1（v1.2 §6.2 P1-1）：门禁核心集在 test job 内直接加 --cov，不新起 job 重跑用例；
        # 权威平台 = ubuntu-latest/Py3.12，Windows 腿只跑测试不产覆盖率（§5.4 契约）
        if: runner.os == 'Linux'
        run: pytest tests/unit tests/leakage_gate tests/realism_gate tests/scripts -q --tb=short --junitxml=test-results.xml --cov=myquant --cov-report=json:coverage.json
        env:
          # headless Linux runner 无显示器/无 GPU，PySide6 用 offscreen 平台插件
          QT_QPA_PLATFORM: offscreen

      - name: 运行全部单元测试（windows 腿，不产覆盖率，权威口径=ubuntu）
        if: runner.os == 'Windows'
        run: pytest tests/unit/ -q --tb=short --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen

      - name: 上传覆盖率数据（ubuntu 腿产物，供 coverage-gate job 判定）
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-ubuntu
          path: |
            coverage.json
            test-results.xml

      - name: 防未来函数专项测试
        run: pytest tests/unit/ -q -m lookahead --tb=short
        # 防未来函数测试必须100%通过，任何未来函数都会导致CI失败

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml

  # ============================================================
  # 任务：架构分层门禁（test_architecture.py v5.1；基线锁定：违规13/真环0/例外10+1/零覆盖存量49；R-23 入口冻结 / R-24 薄化冻结 / R-19 零覆盖冻结，新增即红；#264 单例装配注册表化，scheduler 3 组件经 core.registry 取用，消除例外 EX-13C/E/K，违规 16→13）
  # ============================================================
  architecture-gate:
    name: 架构分层门禁（基线锁定 v5.0：违规/环/超大文件/例外/入口/零覆盖）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: 架构分层门禁（基线锁定回写#259：违规22/真环2/例外14/零覆盖49；G1 限期例外全清零；新增违规/入口/膨胀/零覆盖即红）
        run: pytest tests/unit/test_architecture.py -q --tb=short

  # ============================================================
  # 任务3：V5 三模式一致性回归 + 缓存/指纹专项（P3-6 核心）
  # ============================================================
  consistency-check:
    name: V5 三模式一致性回归 + 缓存/指纹专项
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev,benchmark]"

      - name: 三模式一致性 CLI 回归（默认演示策略，3/3 对通过）
        run: python scripts/一致性校验.py --n-bars 200

      - name: 三引擎一致性单元测试
        run: pytest tests/unit/test_backtest_consistency_v5.py -q --tb=short

      - name: 缓存 / 指纹单元测试
        run: |
          pytest tests/unit/test_factor_cache_v5.py tests/unit/test_data_fingerprint.py -q --tb=short

      - name: 三模式性能基准冒烟（--quick）
        run: python scripts/性能基准测试.py --engine-benchmark-only --quick

  # ============================================================
  # 任务4：回测模块冒烟（V5 新模块导入 + 策略注册器）
  # ============================================================
  backtest-smoke:
    name: 回测模块冒烟（V5 新模块）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev,benchmark]"

      - name: V5 新模块导入校验
        run: |
          python -c "from myquant.backtest.consistency_check import ConsistencyChecker; print('  ✓ V5 三模式一致性校验')"
          python -c "from myquant.backtest.engine_benchmark import EngineBenchmark; print('  ✓ V5 三模式性能基准')"
          python -c "from myquant.utils.memory_watcher import MemoryWatcher; print('  ✓ V5 内存监控')"
          python -c "from myquant.utils.data_fingerprint import compute_fingerprint_from_file; print('  ✓ V5 数据指纹')"
          python -c "from myquant.backtest import vectorized_engine, mixed_engine, engine; print('  ✓ 三模式引擎模块')"

      - name: 策略注册器验证
        run: |
          python -c "
          from myquant.strategies import list_strategies
          strategies = list_strategies()
          print(f'  已注册策略: {strategies}')
          assert 'rsrs' in strategies, 'RSRS策略未注册'
          assert 'ma_cross' in strategies, '均线策略未注册'
          print('  ✓ 策略注册器验证通过')
          "

  # ============================================================
  # 任务5：Docker镜像构建验证
  # ============================================================
  docker-build:
    name: Docker镜像构建
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建版本登记（KP-P5-07：git sha tag 变更留痕）
        run: |
          echo "镜像构建版本: pythonwdhmm:${{ github.sha }}"
          echo "构建日期: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 构建Docker镜像（不推送，仅验证构建成功）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: |
            pythonwdhmm:ci-test
            pythonwdhmm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 任务6：配置文件完整性验证（含 V5 引擎/性能配置）
  # ============================================================
  live-config-check:
    name: 配置文件完整性验证
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: 验证配置文件完整性
        run: |
          python -c "
          import yaml
          from pathlib import Path

          # 1. 4个 example 配置文件都存在且可解析
          # 第4批BUG-09：risk_params.example.yaml 整文件无消费（风控实际读 live_config.risk_control），已删除
          config_files = [
              'config/backtest_config.example.yaml',
              'config/live_config.example.yaml',
              'config/strategy_params.example.yaml',
          ]
          for f in config_files:
              path = Path(f)
              assert path.exists(), f'{f} 不存在'
              with open(path, 'r', encoding='utf-8') as fp:
                  data = yaml.safe_load(fp)
              assert data is not None, f'{f} 内容为空'
              print(f'  {f}: OK')

          # 2. 回测配置：防未来函数必须开启（强制红线）
          with open('config/backtest_config.example.yaml', 'r', encoding='utf-8') as fp:
              bt = yaml.safe_load(fp)
          assert bt['lookahead_guard']['enabled'] == True, '回测防未来函数未开启'
          assert bt['lookahead_guard']['strict_mode'] == True, '回测严格模式未开启'
          print('  ✓ 防未来函数配置验证通过')

          # 3. V5 新增：三模式引擎 + 7 组性能优化开关齐全
          assert bt['engine']['mode'] in ('auto', 'event', 'mixed', 'vectorized'), 'engine.mode 非法'
          perf = bt['performance']
          required = ['parallel', 'backtest_logging', 'timer', 'light_lookahead_guard',
                      'monte_carlo', 'incremental', 'memory']
          for key in required:
              assert key in perf and isinstance(perf[key], dict), f'performance.{key} 缺失'
          print('  ✓ V5 三模式引擎 + 性能优化开关配置验证通过')

          # 4. 回测与实盘配置均包含策略定义
          with open('config/live_config.example.yaml', 'r', encoding='utf-8') as fp:
              live = yaml.safe_load(fp)
          assert 'strategy' in bt and 'strategy' in live, '回测/实盘策略配置缺失'
          assert 'name' in bt['strategy'] and 'name' in live['strategy'], '策略名缺失'
          assert bt['strategy']['name'] in ('rsrs', 'ma_cross', 'grid', 'momentum',
                                            'mean_reversion', 'multi_factor'), '回测策略名非法'
          print('  ✓ 回测策略 {} / 实盘策略 {} 定义有效'.format(
              bt['strategy']['name'], live['strategy']['name']))

          # 5. KP-P5-07: example vs 生产配置键级 diff（防生产配置漂移缺键/多键）
          with open('config/live_config.example.yaml', 'r', encoding='utf-8') as fp:
              example_cfg = yaml.safe_load(fp)
          prod_path = Path('config/live_config.yaml')
          if prod_path.exists():
              with open(prod_path, 'r', encoding='utf-8') as fp:
                  prod_cfg = yaml.safe_load(fp)
              ex_keys = set(example_cfg.keys())
              prod_keys = set(prod_cfg.keys())
              missing = ex_keys - prod_keys
              extra = prod_keys - ex_keys
              assert not missing, f'生产 live_config.yaml 缺失键: {sorted(missing)}'
              print('  ✓ example vs 生产键级 diff: 生产缺失键={} / 生产多余键={}'.format(
                  sorted(missing) or '无', sorted(extra) or '无'))
          else:
              print('  - 无 config/live_config.yaml（生产配置未入库，跳过键级 diff）')
          "



  # ============================================================
  # 任务7：数据清洗专项（P3-8：清洗单测 + 配置检查，无行情数据依赖）
  # ============================================================
  data-clean:
    name: 数据清洗专项
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: 数据清洗单元测试 + 配置完整性（含第4批BUG-07开关消费用例）
        run: pytest tests/unit/test_data_clean.py tests/unit/test_config_live_check.py -q --tb=short

      - name: 清洗规则库加载冒烟（无数据源依赖，仅验证配置→规则映射）
        run: |
          python -c "
          from myquant.data_access.cleaner.rules_loader import load_clean_config, load_clean_rules
          cfg = load_clean_config(use_settings=False)
          assert cfg.get('enabled') is True, '清洗总开关缺失'
          assert 'log_bad_records' in cfg and 'log_quality_report' in cfg, 'BUG-07 开关缺失'
          rules = load_clean_rules(use_settings=False)
          assert len(rules['bar']) > 0 and len(rules['tick']) > 0, '规则映射为空'
          print(f'  清洗配置: bar={len(rules[\"bar\"])}条规则 / tick={len(rules[\"tick\"])}条规则')
          print(f'  开关=log_bad:{cfg[\"log_bad_records\"]}/log_report:{cfg[\"log_quality_report\"]}')
          print('  ✓ 数据清洗规则库加载冒烟通过')
          "

  # ============================================================
  # 任务：防泄漏门禁台账校验（M0-18：代码真消费配置 + 测试断言配置）
  # 机制参照 run_回测入口.py:312-318（lookahead_guard 真消费模式）：
  #   - 测试断言配置：leakage_gate 全量专项 + test_config_live_check + 架构门禁
  #   - 代码真消费配置：入口（run_回测入口.py / run_实盘入口.py）消费 leakage_gate 段
  #     驱动出口断言阻断；强制项缺失（无 leakage_gate 段 / 入口无消费 / 注册表缺策略）即红
  # ============================================================
  leakage-gate-check:
    name: 防泄漏门禁台账校验
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: 防泄漏门禁测试（契约/消费/出口注入/注册强制/配置断言/架构门禁）
        run: pytest tests/leakage_gate/ tests/unit/test_config_live_check.py tests/unit/test_architecture.py -q --tb=short

      - name: 门禁台账强制项校验（代码真消费配置 + 强制项缺失即红）
        run: |
          python -c "
          import yaml
          from pathlib import Path

          # 1. 入库配置 leakage_gate 段强制一致（enabled/audit_violations 均 true，M0-16）
          for f in ['config/backtest_config.example.yaml', 'config/live_config.example.yaml']:
              data = yaml.safe_load(Path(f).read_text(encoding='utf-8'))
              lg = data.get('leakage_gate', {})
              assert lg.get('enabled') is True, f'{f} leakage_gate.enabled 必须 true（M0-16 强制项）'
              assert lg.get('audit_violations') is True, f'{f} leakage_gate.audit_violations 必须 true（M0-16 强制项）'
              print(f'  {f}: leakage_gate 段 OK')

          # 2. 契约真源机读注册表存在且基础策略登记齐全（M0-03 强制项）
          reg = yaml.safe_load(Path('config/strategy_registry.yaml').read_text(encoding='utf-8'))
          names = [str(s['name']) for s in reg.get('strategies', [])]
          required = ['rsrs', 'ma_cross', 'grid', 'momentum', 'mean_reversion', 'multi_factor', 'kunpeng']
          missing = [n for n in required if n not in names]
          assert not missing, f'注册表缺失策略: {missing}'
          print(f'  策略注册表 {len(names)} 项: {names}')

          # 3. 代码真消费配置：入口消费 leakage_gate 段接线存在（M0-18）
          for src_name in ['run_回测入口.py', 'run_实盘入口.py']:
              src = Path(src_name).read_text(encoding='utf-8')
              assert 'leakage_gate' in src and 'set_config' in src, \
                  f'{src_name} 未消费 leakage_gate 配置（M0-18 代码真消费接线缺失）'
              print(f'  {src_name}: leakage_gate 真消费接线 OK')
          print('  ✓ 门禁台账强制项校验通过（强制项缺失即红）')
          "

  # ============================================================
  # 任务：静态 AST 扫描（阶段 1-B，M1B-07）
  # 新代码不过静态扫描（存在阻断命中）不得进入回测/实盘链路。
  #   - 全库扫描 scripts/静态扫描.py --all：阻断命中即失败
  #   - 静态扫描反向测试（注入泄漏 → 必报红）：tests/leakage_gate/test_static_scan.py
  # 本地 pre-commit hook（.pre-commit-config.yaml leakage-static-scan）并行兜底。
  # ============================================================
  static-scan-check:
    name: 防泄漏静态扫描（M1B-07）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: 全库静态扫描（阻断命中即失败；R01a/R02/R04/R05/R09/R10 阻断）
        run: python scripts/静态扫描.py --all

      - name: 静态扫描反向测试（注入泄漏 → 必报红；含横截面 as-of 与因子截断重算自检）
        run: pytest tests/leakage_gate/test_static_scan.py -q --tb=short

  # ============================================================
  # 任务：阶段 3 审计收口门禁矩阵（M3-03）
  # 台账校验 + 静态扫描 + 消费侧 + sanity + 契约 + PIT + 专项测试全绿。
  #   - 豁免流（exemption）：过期由门禁中心自动拦截（test_exemption.py）
  #   - 审计报告（report）：每次实验产出 leakage_report.json + 保留期 + 清理衔接
  #     （test_report.py 校验 cleanup_service 模式识别与按期归组清理）
  #   - 台账/接线断言：report/exemption 模块存在、cleanup_service 纳入
  #     leakage_report_*.json、gate 集成豁免压制钩子。
  # ============================================================
  leakage-audit-matrix:
    name: 审计收口门禁矩阵（M3-03：豁免+报告+清理+PIT）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: 豁免流专项测试（M3-02：豁免过期 → 门禁中心自动拦截）
        run: pytest tests/leakage_gate/test_exemption.py -q --tb=short

      - name: 审计报告专项测试（M3-01：leakage_report.json + 保留期 + 清理衔接）
        run: pytest tests/leakage_gate/test_report.py tests/unit/test_cleanup_service.py tests/unit/test_cleanup_dryrun.py -q --tb=short

      - name: 契约 / 消费侧 / sanity / PIT（tests/leakage_gate 全量防回归）
        run: pytest tests/leakage_gate/ -q --tb=short

      - name: M3 台账与接线断言（缺失即红）
        run: |
          python -c "
          from pathlib import Path
          # 1. 模块存在
          for mod in ['myquant/leakage_gate/report.py', 'myquant/leakage_gate/exemption.py']:
              assert Path(mod).is_file(), f'{mod} 缺失'
          # 2. 清理衔接：cleanup_service 纳入 leakage_report_*.json
          src = Path('myquant/utils/cleanup_service.py').read_text(encoding='utf-8')
          assert 'leakage_report_*.json' in src, 'cleanup_service 未纳入 leakage_report 产物'
          # 3. gate 集成豁免压制钩子（过期豁免 → 门禁自动拦截）
          gate_src = Path('myquant/leakage_gate/gate.py').read_text(encoding='utf-8')
          assert 'suppress_violations' in gate_src, 'gate 未集成豁免压制钩子'
          # 4. 包导出登记
          init_src = Path('myquant/leakage_gate/__init__.py').read_text(encoding='utf-8')
          assert 'import report' in init_src and 'import exemption' in init_src, 'leakage_gate 未导出 report/exemption'
          print('  ✓ M3 台账与接线断言通过（模块/清理衔接/豁免钩子/包导出）')
          "

  # ============================================================
  # 任务：覆盖率门禁（P1，v1.2 §6.2 P1-3/P1-10）
  # 报告模式首轮：由 CI 自产基线数字，下一提交冻结并转阻断（§6.0 原则4：先报告、后阻断）。
  # 判据全部在 myquant/leakage_gate/coverage_gate.py（C-1~C-7 + V-9 分层口径自洽）。
  # ============================================================
  coverage-gate-check:
    name: 覆盖率门禁（P1，报告模式）
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: 下载覆盖率数据（test job ubuntu 腿产物）
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-ubuntu

      - name: 覆盖率门禁判据（阻断模式：基线已冻结 run 38664760515，C-1~C-7 违反即红）
        run: python scripts/覆盖率门禁.py --json coverage.json --junit test-results.xml

      # P4 常态治理（v1.2 §6.5 ②）：PR 时发布覆盖率差异评论（非阻断，供评审者一眼看到覆盖率状态）
      - name: PR 覆盖率评论（P4 §6.5）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cov=$(python -c "import json;print(round(json.load(open('coverage.json'))['totals']['percent_covered'],2))")
          covered=$(python -c "import json;print(int(json.load(open('coverage.json'))['totals']['covered_lines']))")
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "✅ 覆盖率门禁通过（C-1~C-8 全绿）：总行覆盖 **${cov}%**（已覆盖 ${covered} 行）。详见 [Actions 运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。"

  # ============================================================
  # 任务：依赖与 CI 安全扫描（KP-M03：pip-audit 漏洞 + gitleaks 密钥）
  # ============================================================
  security-scan:
    name: 依赖漏洞与密钥扫描
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        # 全量克隆：gitleaks 对 push 事件扫描 before^..after 范围，
        # 浅克隆（默认 fetch-depth:1）缺 before 的父提交 → "unknown revision" 失败（#410）
        with:
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装项目
        run: pip install -e ".[dev]"

      - name: pip-audit 依赖漏洞扫描（KP-M03）
        run: |
          pip install pip-audit
          # 直接审计已安装环境（requirements.lock 中 akshare 传递依赖未钉死，--require-hashes 模式拒绝）
          pip-audit

      - name: gitleaks 密钥泄露扫描（KP-M03）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


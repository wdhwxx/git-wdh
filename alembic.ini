# Alembic configuration - Pythonwdhmm Quant Trading System
# Database migration config, used with myquant/database/migrations/

[alembic]
# Migration scripts directory (relative to this ini file)
script_location = myquant/database/migrations

# Migration script filename template: revision_slug.py
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = Asia/Shanghai

# Database connection URL (SQLite, relative path based on project root)
# Can be overridden by env var QUANT_DB_URL (for live/testing db switching)
sqlalchemy.url = sqlite:///database/quant.db

# Truncate slug length
truncate_slug_length = 40

# Alembic version table name (internal migration history)
version_table = alembic_version

# Version path separator
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

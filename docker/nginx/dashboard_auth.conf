# nginx 反代配置：Pythonwdhmm 实盘看板鉴权网关（KP-P4-06 加固）
# 经 Basic Auth 校验后转发到 dashboard 容器 8501（内部网络，不直出宿主）
# 安全加固（KP-P4-06）：
#   - TLS：仅 443 ssl 服务，证书/私钥由部署方置于 docker/nginx/certs（不入库，卷挂载 /etc/nginx/certs）
#   - HSTS：强制浏览器仅走 HTTPS，杜绝明文传输口令
#   - 明文 HTTP(80) 一律 301 跳转 HTTPS
#   - 强认证：Basic Auth；口令经 docker secret 注入 /run/secrets/dashboard_auth_password，不落环境变量明文

# 明文 HTTP → 一律 301 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 服务块（TLS 强制）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS 证书/私钥：docker/nginx/certs 卷挂载；由部署方提供（不入库）
    ssl_certificate     /etc/nginx/certs/dashboard.crt;
    ssl_certificate_key /etc/nginx/certs/dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS：强制浏览器仅走 HTTPS（KP-P4-06）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 强认证：Basic Auth；口令经 docker secret 注入 /run/secrets/dashboard_auth_password
    auth_basic "Pythonwdhmm 实盘看板";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://dashboard:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamlit 为 WebSocket 应用，需升级头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

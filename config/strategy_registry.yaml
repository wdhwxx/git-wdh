# ============================================================
# config/strategy_registry.yaml —— 策略注册表 + ruleset 映射（防泄漏门禁 L-1 契约层）
# ============================================================
# 归属：未来函数与数据泄漏门禁 · 阶段 0-A（M0-03）
# 依据：《未来函数与数据泄漏门禁施工方案.md（v3.0 定稿）》§5.2（附录 B 契约模板 + §5.2 修正）
# 生成日期：2026-10-10
# 契约主键 = name（策略类属性）；strategy_id 仅展示别名（DEC-01 拍板，见 v3.0 §5.2 修正 2）
# 本文件为真实配置，例外入库（.gitignore !config/strategy_registry.yaml），供：
#   - 出口强制：run_回测入口.py / run_实盘入口.py 读契约做 assert_all_gates_pass
#   - 契约校验：myquant/leakage_gate/contract.py（阶段 0-A M0-06）
#   - CI 门禁矩阵：.github/workflows/ci.yml（M0-18）
# 消费列（consumed_columns）为声明侧输入（R11，声明可漏报，实际以 AST 实测为准，见 v3.0 §10.8）
# ============================================================

strategies:
  # ---------- RSRS 阻力支撑策略（ma_strategy.py:78） ----------
  - strategy_id: rsrs_strategy
    name: "rsrs"                 # ← 唯一主键（registry 以 name 为键）
    type: daily_equity
    decision_time: "T日收盘后 15:00"
    execution_time: "T+1开盘 09:30"
    holding_period: "20交易日"
    universe:
      type: "static"
      source: "config/stock_pool.yaml"
      pit_status: "未建设"         # 显式声明，避免契约自证 PIT（v3.0 附录 B 注4）
    data_availability:
      market_data:
        available_time: "T日15:00"
        adjust: "hfq"             # 真实配置为 hfq（非 raw），消费期现算
        adjust_asof: "end_date 必传"
        fields: [开盘价, 最高价, 最低价, 收盘价, 成交量, 成交额]
      financial_data:
        available_time: "ann_date"
        basis: "eff_disclosure_date"   # 统一时点日落点函数（v3.0 §6.4.2）
        fields: []
    consumed_columns: [收盘价, 成交量]
    ruleset: daily_close_decision
    owner: "pythonwdhmm"

